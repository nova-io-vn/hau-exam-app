name: Mobile CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "components/**"
      - "constants/**"
      - "hooks/**"
      - "assets/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "eas.json"
      - "tsconfig.json"
      - "eslint.config.js"
      - ".github/workflows/mobile-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate mobile app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Show environment
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Expo Doctor
        run: npx expo-doctor

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate Expo export
        run: npm run validate:export

  publish:
    name: Publish EAS update
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Expo and EAS
        if: ${{ env.EXPO_TOKEN != '' }}
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Publish EAS Update
        if: ${{ env.EXPO_TOKEN != '' }}
        run: eas update --channel production --message "GitHub ${{ github.sha }}" --non-interactive
